<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
		/>
		<meta name="theme-color" content="#150d0a" />
		<meta name="color-scheme" content="dark" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/press-start-2p-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<meta
			name="description"
			content="Timmies Passport - track every Tim Hortons in the world and collect the ones you've visited like passport stamps."
		/>
		<!-- Fallback only; every route sets its own title from src/lib/brand.ts.
		     This file cannot import, so it is the one other place a rename touches. -->
		<title>Timmies Passport</title>
		<!-- Filled in per-request by hooks.server.ts. -->
		%canonical%

		<!-- The share card. Absolute URLs, because a scraper resolves these
		     against nothing. The canonical link varies per route, so it is
		     stamped into %canonical% above by hooks.server.ts. -->
		<meta property="og:site_name" content="My Timmies Passport" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="My Timmies Passport" />
		<meta
			property="og:description"
			content="Collect every Tim Hortons in the world like passport stamps."
		/>
		<meta property="og:url" content="https://mytimmiespassport.com" />
		<meta property="og:image" content="https://mytimmiespassport.com/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="An arcade cabinet framing a map of Canada covered in coffee cup markers."
		/>
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
